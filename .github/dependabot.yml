# Monthly, one pull request per group, so updates stay few. Security fixes come separately, as
# soon as they exist (Settings > Advanced Security).
#
# There's no cargo entry: the helpers use the hub's SDK from a checkout next to this repository,
# which Dependabot doesn't have, so it can't resolve their dependencies.
version: 2
updates:
  # The workflows pin actions to commits, so nothing else moves them forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
