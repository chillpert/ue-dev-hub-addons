# Builds and tests every addon on Windows and Linux for every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ue-dev-hub-addons
          persist-credentials: false

      # The addons use the hub's SDK crate and addon API types from a checkout next to this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chillpert/ue-dev-hub
          ref: ${{ vars.HUB_REF || 'main' }}
          path: ue-dev-hub
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ue-dev-hub-addons/package-lock.json

      # The version, clippy and rustfmt come from rust-toolchain.toml.
      - name: Install Rust
        working-directory: ue-dev-hub-addons
        run: rustup toolchain install

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ue-dev-hub-addons/addons/git/helper

      - working-directory: ue-dev-hub-addons
        run: npm ci

      - name: Check the pages
        working-directory: ue-dev-hub-addons
        run: npx tsc --noEmit

      - name: Test and lint the helpers
        working-directory: ue-dev-hub-addons/addons/git/helper
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build and pack
        working-directory: ue-dev-hub-addons
        run: |
          npm run build
          npm run pack
