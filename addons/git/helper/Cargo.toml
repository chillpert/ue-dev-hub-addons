[package]
name = "ue-dev-hub-git"
version = "1.0.0"
description = "The Git addon's helper for UE Dev Hub"
edition = "2024"
license = "MIT"
repository = "https://github.com/chillpert/ue-dev-hub-addons"
publish = false

[dependencies]
# The hub repository sits next to this one (CI checks it out there too).
ue-dev-hub-addon = { path = "../../../../ue-dev-hub/addon-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
toml = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
